# =============================================================================
# Anker Solix Device Configuration File
# 由 VE 提供：文件名 = SHA256("anker_solix_ha_2024" + "DMWHVESIM")
# 即 VE 在 Modbus 0x8000 上报的 PN("DMWHVESIM") 经官方插件加盐哈希后的值。
# 复制到官方插件 custom_components/anker_solix_official/config/ 目录即可识别 VE。
# 内容与官方 Solarbank Max AC 配置一致（auto_mode_on_connect=3 自动切第三方接管）。
# =============================================================================
product_info:
  default_name: "Anker SOLIX Solarbank Max AC"
  sn_register_key: "device_sn"
  model_register_key: "device_model"
  auto_mode_on_connect: 3
  product_code_mapping:
    "DMWH": "Anker SOLIX Solarbank Max AC"
    "DMXU": "Anker SOLIX Solarbank Max AC"
    "E25H": "Anker SOLIX Solarbank Max AC"
    "DNMS": "Anker SOLIX XE AC"
    "DPP4": "Anker SOLIX XE AC"
    "DNN3": "Anker SOLIX XE AC"

batch_read_ranges:
  input:
    - 10000-10050
    - 10090-10156
    - 10208-10265
    - 32768-32774
  holding:
    - 10060-10072
    - 10074-10081
    - 60000-60003

read_quantities:
  device_model:
    translation_key: "device_model"
    address: 32768
    data_type: "STRING"
    unit: "/"
    gain: 1
    count: 5
    icon: "mdi:information"
  device_sn:
    translation_key: "device_sn"
    address: 10100
    data_type: "STRING"
    unit: "/"
    gain: 1
    count: 12
    icon: "mdi:identifier"
  device_sw_version:
    translation_key: "device_sw_version"
    address: 10112
    data_type: "STRING"
    unit: "/"
    gain: 1
    count: 6
    icon: "mdi:information"
  battery_soc:
    translation_key: "battery_soc"
    address: 10014
    data_type: "UINT16"
    unit: "%"
    gain: 1
    count: 1
    icon: "mdi:battery"
  pv_power:
    translation_key: "pv_power"
    address: 10002
    data_type: "INT32"
    unit: "W"
    gain: 1
    count: 2
    icon: "mdi:solar-power"
    additional_sources:
      - "third_party_pv_power"
  third_party_pv_power:
    translation_key: "third_party_pv_power"
    address: 10004
    data_type: "INT32"
    unit: "W"
    gain: 1
    count: 2
    icon: "mdi:solar-power-variant"
    internal: true
  battery_charging_power:
    translation_key: "battery_charging_power"
    address: 10008
    data_type: "INT32"
    unit: "W"
    gain: 1
    count: 2
    icon: "mdi:battery-charging"
    power_split_mode: "negative_only"
  battery_discharging_power:
    translation_key: "battery_discharging_power"
    address: 10008
    data_type: "INT32"
    unit: "W"
    gain: 1
    count: 2
    icon: "mdi:battery-arrow-down"
    power_split_mode: "positive_only"
  load_power:
    translation_key: "load_power"
    address: 10010
    data_type: "INT32"
    unit: "W"
    gain: 1
    count: 2
    icon: "mdi:home-lightning-bolt"
  grid_import_power:
    translation_key: "grid_import_power"
    address: 10012
    data_type: "INT32"
    unit: "W"
    gain: 1
    count: 2
    icon: "mdi:transmission-tower-export"
    power_split_mode: "positive_only"
  grid_export_power:
    translation_key: "grid_export_power"
    address: 10012
    data_type: "INT32"
    unit: "W"
    gain: 1
    count: 2
    icon: "mdi:transmission-tower-import"
    power_split_mode: "negative_only"
  ac_grid_output_power:
    translation_key: "ac_grid_output_power"
    address: 10208
    data_type: "INT32"
    unit: "W"
    gain: 1
    count: 2
    icon: "mdi:transmission-tower-export"
  pv_total_generation:
    translation_key: "pv_total_generation"
    address: 10018
    data_type: "UINT32"
    unit: "kWh"
    gain: 10
    count: 2
    icon: "mdi:counter"
  cumulative_charge_energy:
    translation_key: "cumulative_charge_energy"
    address: 10262
    data_type: "UINT32"
    unit: "kWh"
    gain: 10
    count: 2
    icon: "mdi:battery-plus"
  cumulative_discharge_energy:
    translation_key: "cumulative_discharge_energy"
    address: 10264
    data_type: "UINT32"
    unit: "kWh"
    gain: 10
    count: 2
    icon: "mdi:battery-minus"
  rated_energy:
    translation_key: "rated_energy"
    address: 10250
    data_type: "UINT32"
    unit: "kWh"
    gain: 10
    count: 2
    icon: "mdi:battery"
  battery_status:
    translation_key: "battery_status"
    address: 10001
    data_type: "UINT16"
    unit: "/"
    gain: 1
    count: 1
    icon: "mdi:battery"
    value_mapping:
      0: "standby"
      1: "charging"
      2: "discharging"
      3: "sleep"
  max_charge_power:
    translation_key: "max_charge_power"
    address: 10036
    data_type: "INT32"
    unit: "W"
    gain: 1
    count: 2
    icon: "mdi:battery-charging-high"
    internal: true
  max_discharge_power:
    translation_key: "max_discharge_power"
    address: 10038
    data_type: "INT32"
    unit: "W"
    gain: 1
    count: 2
    icon: "mdi:battery-arrow-down-outline"
    internal: true
  ems_mode_mask:
    translation_key: "ems_mode_mask"
    address: 32774
    data_type: "UINT16"
    unit: "/"
    gain: 1
    count: 1
    icon: "mdi:format-list-checks"
    internal: true
  backup_soc_enable:
    translation_key: "backup_soc_enable"
    address: 60003
    data_type: "UINT16"
    unit: "/"
    gain: 1
    count: 1
    icon: "mdi:battery-lock"
    value_mapping:
      0: "disabled"
      1: "enabled"
    capability_entity: "parallel_capability_mask"
    capability_bit: 3
    internal: true
  parallel_capability_mask:
    translation_key: "parallel_capability_mask"
    address: 0x8007
    register_type: "input"
    data_type: "UINT16"
    unit: "/"
    gain: 1
    count: 1
    icon: "mdi:feature-search"
    internal: true

write_quantities:
  enumeration_selection:
    operating_mode:
      translation_key: "operating_mode"
      address: 10064
      data_type: "UINT16"
      unit: "/"
      gain: 1
      count: 1
      icon: "mdi:cog"
      control_type: "select"
      write_protection_duration: 15
      capability_entity: "ems_mode_mask"
      options:
        "0": "self_consumption"
        "1": "tou_mode"
        "3": "third_party_control"
        "4": "custom_mode"
        "5": "socket_overlay_mode"
        "6": "smart_mode"
        "7": "dynamic_pricing"
      option_capability_bits:
        "0": 0
        "1": 1
        "3": 5
        "4": 2
        "5": 4
        "6": 3
        "7": 6
    battery_power_direction:
      translation_key: "battery_power_direction"
      address: 10071
      data_type: "INT32"
      unit: "/"
      gain: 1
      count: 2
      icon: "mdi:battery-sync"
      control_type: "select"
      options:
        "0": "charge"
        "1": "discharge"
      is_direction_selector: true
      visibility_entity: "operating_mode"
      visibility_value: 3

control_items:
  battery_power_setpoint:
    translation_key: "battery_power_setpoint"
    address: 10071
    data_type: "INT32"
    unit: "W"
    gain: 1
    count: 2
    icon: "mdi:lightning-bolt"
    data_type_category: "control"
    display_type: "input"
    min_value: 0
    max_value: 10000
    step: 1
    direction_entity: "battery_power_direction"
    max_charge_power_entity: "max_charge_power"
    max_discharge_power_entity: "max_discharge_power"
    visibility_entity: "operating_mode"
    visibility_value: 3
    never_read_device: true
    default_value: 0
  charging_limit_soc:
    translation_key: "charging_limit_soc"
    address: 60000
    data_type: "UINT16"
    unit: "%"
    gain: 1
    count: 1
    icon: "mdi:battery-arrow-up"
    data_type_category: "control"
    display_type: "input"
    min_value: 80
    max_value: 100
    step: 1
    capability_entity: "parallel_capability_mask"
    capability_bit: 0
  discharge_limit_soc:
    translation_key: "discharge_limit_soc"
    address: 60001
    data_type: "UINT16"
    unit: "%"
    gain: 1
    count: 1
    icon: "mdi:battery-arrow-down"
    data_type_category: "control"
    display_type: "input"
    min_value: 0
    max_value: 20
    step: 1
    capability_entity: "parallel_capability_mask"
    capability_bit: 1
  backup_reserve_soc:
    translation_key: "backup_reserve_soc"
    address: 60002
    data_type: "UINT16"
    unit: "%"
    gain: 1
    count: 1
    icon: "mdi:battery-lock"
    data_type_category: "control"
    display_type: "input"
    min_value: 0
    max_value: 100
    step: 1
    capability_entity: "parallel_capability_mask"
    capability_bit: 2
