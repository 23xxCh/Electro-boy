    <text x="72" y="160" class="small">两个入口，共用一个家庭管家</text>
    <text x="437" y="133" fill="#a6b38d" font-size="13" font-weight="650">02</text><text x="471" y="133" class="title" font-size="21">理解与记忆</text>
