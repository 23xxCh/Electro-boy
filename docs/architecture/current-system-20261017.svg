  <!-- Separate candidate namespace: read-only arrows never lead into execution. -->
  <g data-node="release-candidate">
    <rect x="72" y="1045" width="1536" height="210" rx="24" fill="#f3efe2" stroke="#b9a370" stroke-width="1.5" stroke-dasharray="9 4 2 4"/>
    <text x="96" y="1081" fill="#8e7542" font-size="21" font-weight="650">独立环境机只读支路</text>
    <text x="1584" y="1080" fill="#9c8863" font-size="14" font-weight="600" text-anchor="end">离线代码候选 · 未部署 · 默认关闭 · 远端控制未开放</text>
    <g data-node="release-entry"><rect x="96" y="1107" width="250" height="89" rx="14" fill="#fbf9f2" stroke="#ddd2b9"/><text x="113" y="1138" fill="#846b3e" font-size="17" font-weight="650">App / 管家只读入口</text><text x="113" y="1165" fill="#9c8863" font-size="12">GET /api/assistant/environment</text><text x="113" y="1184" fill="#9c8863" font-size="12">精确查询：“环境机状态”</text></g>
    <path d="M346 1150H401" class="candidate-line" marker-start="url(#candidate)"/>
    <g data-node="release-adapter"><rect x="401" y="1107" width="330" height="89" rx="14" fill="#fbf9f2" stroke="#ddd2b9"/><text x="418" y="1138" fill="#846b3e" font-size="17" font-weight="650">RuntimeAPI → ReleasePipeline</text><text x="418" y="1165" fill="#9c8863" font-size="13">GET /environment/snapshot</text><text x="418" y="1184" fill="#9c8863" font-size="12">独立来源，不混本机 decision / HUD</text></g>
    <path d="M731 1150H782" class="candidate-line" marker-start="url(#candidate)"/>
    <g data-node="release-simulator"><rect x="782" y="1107" width="330" height="89" rx="14" fill="#fbf9f2" stroke="#ddd2b9"/><text x="799" y="1138" fill="#846b3e" font-size="17" font-weight="650">队友 DJXZ Simulator</text><text x="799" y="1165" fill="#9c8863" font-size="13">复用原 SolarBank / HaClient</text><text x="799" y="1184" fill="#9c8863" font-size="12">仅查询与纯命令准备，不下发控制</text></g>
    <path d="M1112 1150H1156" class="candidate-line" marker-start="url(#candidate)"/>
    <g data-node="release-ha"><rect x="1156" y="1107" width="428" height="89" rx="14" fill="#fbf9f2" stroke="#ddd2b9"/><text x="1173" y="1138" fill="#846b3e" font-size="17" font-weight="650">远端官方 HA（尚未验证）</text><text x="1173" y="1165" fill="#9c8863" font-size="13">家庭1读数；缺失保留为空，0值保留</text><text x="1173" y="1184" fill="#9c8863" font-size="12">环境身份 / 时间基准未验；控制始终 blocked</text></g>
    <text x="96" y="1228" fill="#9c8863" font-size="13">只读数据返回；没有连通测试，没有部署或启用配置。远端控制还缺单槽、退出、next-tick与结算证明。</text>
  </g>
  <text x="72" y="1290" fill="#7b877c" font-size="13">以源码和既有验收为准；本轮未做连通测试、未重验服务。本机单时段不等于真实家庭持续自治，绿色也不代表此刻在线。</text>
  <text x="1608" y="1315" fill="#94a08d" font-size="12" text-anchor="end">原图保留 · 不为匹配图而改动系统</text>
</svg>
