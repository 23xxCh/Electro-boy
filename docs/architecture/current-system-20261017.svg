<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1330" viewBox="0 0 1680 1330" role="img" aria-labelledby="title desc">
  <title id="title">电击小子当前系统架构：共享管家、本机闭环与环境机只读候选</title>
  <desc id="desc">Web App 与飞书机器人共用 Service、SQLite 持久记忆和最近十分钟交互记录。Service 经 RuntimeTools 和 RuntimeAPI 调用能源 Runtime；PV LSTM 与 DM 负责预测，HiGHS LP 负责规划。资料保存与设备执行分开确认，只有当前方案首十五分钟经 LocalHA、官方 HA 插件和本机 Debug 仿真执行，实际回读与结算收据回流。环境机只读接入为默认关闭、未部署的独立代码候选。主动通知、能源偏差监控、自动重规划及挑战 Agent 均为规划能力，未接入主链。本机单时段验收不等于真实家庭连续自治。</desc>
