      .small { fill:#7b877c; font-size:13px; }
      .eyebrow { fill:#7f956e; font-size:12px; font-weight:650; }
      .card { fill:#ffffff; stroke:#dce3d5; stroke-width:1.4; }
      .line { stroke:#648362; stroke-width:1.8; fill:none; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#flow); }
      .candidate-line { stroke:#9c8863; stroke-width:1.8; fill:none; stroke-dasharray:9 4 2 4; stroke-linecap:round; marker-end:url(#candidate); }
    </style>
  </defs>
