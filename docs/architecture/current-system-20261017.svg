    <marker id="flow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" stroke="#648362" stroke-width="1.4" fill="none"/></marker>
    <marker id="candidate" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" stroke="#9c8863" stroke-width="1.4" fill="none"/></marker>
