<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1034" viewBox="0 0 1680 1034" role="img" aria-labelledby="title desc">
<title id="title">Everywatt 双入口、双Agent与固定监控系统架构</title>
<desc id="desc">App与聊天软件Chatbot两个入口共同接入能源管家Agent。管家理解需求、解释决策并协调干预。策略挑战Agent读取计划与用户约束，提出挑战并调用回放验证，将风险证据交给管家；固定监控程序按规则产生异常事件，也交给管家处理。预测器与策略程序负责数值计算，设备执行统一经HA。图中区分已接链路与后续接入功能。</desc>
