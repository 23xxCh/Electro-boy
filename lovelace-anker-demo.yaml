# 待替换：形如 {{site1_soc}} 的 34 个标记是实体 ID 占位符；填入真实 HA entity_id 后再粘贴到 Lovelace 原始配置编辑器。
# 本文件只配置看板，不创建实体。外部调度程序应把模拟器数据写入专用 HA 展示实体，不得覆盖官方设备实体。
# 以下属性是本方案定义的 HA 展示态契约，不代表模拟器原始 API 字段：
# 数字实体的 state 必须是纯有限数值字符串；W、%、币种等放 unit_of_measurement，不写进 state。
# 电价实体 state=当前购电价，attributes.sell_price=当前售电价或 null，
# attributes.sim_now=模拟器当前时刻，
# attributes.periods=[{start:模拟器时刻(带时区 ISO 8601), buy_price:数值, sell_price:数值或 null}]，
# 仅保留当前和未来时段；图形按 sim_now 映射成相对时间，不把模拟时钟当现实时间。
# 天气实体 state=预测辐照度(W/m²)，attributes.weather/valid_at；
# 决策实体 state=充电/放电/待机，attributes.reason/target_power_w/source_timestamp/valid_until；
# valid_until 是 HA 实时时钟中的计划有效期，过期后看板不显示旧指令为“当前”。
# 金额实体 state=同一结算窗内相对原生自发自用的差额，正数为节省，负数为多花；
# 金额和独立改善率需取得赛方基线及策略结算数据后才能推送，不等同已确认的官方排名分。
title: Anker 三站能源调度
views:
  - title: 总览
    path: overview
    icon: mdi:view-dashboard
    type: sections
    sections:
      - type: grid
        cards:
          - type: markdown
            title: 排名分与待核对照
            entity_id:
              - "{{score_total}}" # 待替换：模拟器总览 saving_settled_percent
              - "{{savings_percent_vs_native}}" # 待替换：待核算的相对原生自用改善率
              - "{{savings_amount_total}}" # 待替换：待核算的三站合计结算差额
            content: |-
              {% set score = '{{score_total}}' %}
              {% set pct = '{{savings_percent_vs_native}}' %}
              {% set amt = '{{savings_amount_total}}' %}
              ### 官方排名分
              {% if is_number(states(score)) %}# {{ states(score) | float | round(2) }}%{% else %}# 待接入{% endif %}

              **对照口径待核：** 相对设备原生自发自用的改善率：
              {% if is_number(states(pct)) %}**{{ states(pct) | float | round(2) }}%**{% else %}**待接入**{% endif %}
              {% if is_number(states(amt)) %}
              {% set v = states(amt) | float %}
              {% if v >= 0 %}🟢 已节省 **{{ v | round(2) }} {{ state_attr(amt, 'unit_of_measurement') or '币种待确认' }}**{% else %}🔴 多花 **{{ (v | abs) | round(2) }} {{ state_attr(amt, 'unit_of_measurement') or '币种待确认' }}**{% endif %}
              {% else %}
              金额待接入
              {% endif %}

              官方分数结算时刻：{{ state_attr(score, 'source_timestamp') or '待接入' }}
      - type: grid
        cards:
          - type: markdown
            title: 三站共享电价
            entity_id:
              - "{{tariff_current_buy}}" # 待替换：当前购电价，售电价放在 sell_price 属性
            content: |-
              {% set t = '{{tariff_current_buy}}' %}
              {% set u = state_attr(t, 'unit_of_measurement') or '单位待确认' %}
              🔴 **购电** {% if is_number(states(t)) %}{{ states(t) }} {{ u }}{% else %}待接入{% endif %}

              {% set sell = state_attr(t, 'sell_price') %}
              {% if sell is number and sell < 0 %}🔴{% else %}🟢{% endif %} **售电** {% if sell is number %}{{ sell }} {{ u }}{% else %}待接入{% endif %}

              {% if sell is number and sell < 0 %}⚠️ 售电价为负，避免主动向电网送电。{% elif sell is not number %}售电价未知，暂不判断卖电收益。{% endif %}
      - type: grid
        cards:
          - type: markdown
            title: 站点 1 · 实测与原因
            entity_id:
              - "{{site1_soc}}" # 待替换
              - "{{site1_solar_power}}" # 待替换
              - "{{site1_home_load}}" # 待替换
              - "{{site1_battery_charging_power}}" # 待替换
              - "{{site1_battery_discharging_power}}" # 待替换
              - "{{site1_grid_import_power}}" # 待替换
              - "{{site1_grid_export_power}}" # 待替换
              - "{{decision_site1}}" # 待替换：程序写入的计划与解释
              - "{{savings_amount_site1}}" # 待替换：本站待核算结算差额
            content: |-
              {% set soc = '{{site1_soc}}' %}
              {% set pv = '{{site1_solar_power}}' %}
              {% set load = '{{site1_home_load}}' %}
              {% set c = '{{site1_battery_charging_power}}' %}
              {% set d = '{{site1_battery_discharging_power}}' %}
              {% set gi = '{{site1_grid_import_power}}' %}
              {% set ge = '{{site1_grid_export_power}}' %}
              {% set a = '{{savings_amount_site1}}' %}
              {% macro kw(e) -%}{% if is_number(states(e)) %}{{ (states(e) | float / 1000) | round(2) }}{% else %}—{% endif %}{%- endmacro %}
              {% if is_number(states(c)) and is_number(states(d)) %}
              {% if states(c) | float > 0 and states(d) | float > 0 %}⚠️ **充放电读数冲突**{% elif states(c) | float > 0 %}🔵 **正在充电 {{ kw(c) }} kW**{% elif states(d) | float > 0 %}🟠 **正在放电 {{ kw(d) }} kW**{% else %}⚪ **电池待机**{% endif %}
              {% else %}⚪ **实测状态待接入**{% endif %}

              SOC：{% if is_number(states(soc)) %}**{{ states(soc) | float | round(1) }}%**{% else %}待接入{% endif %}

              **实时功率构成：** 下方两条彩色图依次表示来源侧 → 去向侧。

              {% set decision = '{{decision_site1}}' %}
              {% set expiry = as_datetime(state_attr(decision, 'valid_until'), none) %}
              **为什么：** {% if has_value(decision) and expiry and expiry > now() %}{{ state_attr(decision, 'reason') or '解释待写入' }}{% else %}⚠️ 调度解释未接入或已过期{% endif %}

              {% if is_number(states(a)) %}{% set v = states(a) | float %}{% if v >= 0 %}🟢 本站已节省 {{ v | round(2) }} {{ state_attr(a, 'unit_of_measurement') or '币种待确认' }}{% else %}🔴 本站多花 {{ (v | abs) | round(2) }} {{ state_attr(a, 'unit_of_measurement') or '币种待确认' }}{% endif %}{% else %}本站结算金额待接入{% endif %}
          - type: distribution
            title: 站点 1 · 来源侧 → 家庭总线（W）
            entities:
              - entity: "{{site1_solar_power}}" # 待替换
                name: 光伏
                color: "#f9a825"
              - entity: "{{site1_battery_discharging_power}}" # 待替换
                name: 电池放出
                color: "#f57c00"
              - entity: "{{site1_grid_import_power}}" # 待替换
                name: 电网购入
                color: "#d32f2f"
          - type: distribution
            title: 站点 1 · 家庭总线 → 去向侧（W）
            entities:
              - entity: "{{site1_home_load}}" # 待替换
                name: 家庭负载
                color: "#1976d2"
              - entity: "{{site1_battery_charging_power}}" # 待替换
                name: 电池充入
                color: "#7e57c2"
              - entity: "{{site1_grid_export_power}}" # 待替换
                name: 电网外送
                color: "#78909c"
      - type: grid
        cards:
          - type: markdown
            title: 站点 2 · 实测与原因
            entity_id:
              - "{{site2_soc}}" # 待替换
              - "{{site2_solar_power}}" # 待替换
