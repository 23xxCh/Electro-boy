  - title: 电价
    path: tariff
    icon: mdi:cash-multiple
    type: sections
    sections:
      - type: grid
        cards:
          - type: markdown
            title: 当前买卖电价
            entity_id:
              - "{{tariff_current_buy}}" # 待替换：三站共享电价展示实体
            content: |-
              {% set t = '{{tariff_current_buy}}' %}
              {% set u = state_attr(t, 'unit_of_measurement') or '单位待确认' %}
              {% set sell = state_attr(t, 'sell_price') %}
              🔴 **当前购电价：** {% if is_number(states(t)) %}{{ states(t) }} {{ u }}{% else %}待接入{% endif %}

              {% if sell is number and sell < 0 %}🔴{% else %}🟢{% endif %} **当前售电价：** {% if sell is number %}{{ sell }} {{ u }}{% else %}待接入{% endif %}

              模拟器当前时刻：{{ state_attr(t, 'sim_now') or '待接入' }}

              {% if sell is number and sell < 0 %}<ha-alert alert-type="warning">售电价为负：避免主动外送；电池供家用仍可能合理。</ha-alert>{% elif sell is not number %}<ha-alert alert-type="info">售电价未知，不能根据购电价判断卖电收益。</ha-alert>{% endif %}
      - type: grid
        cards:
          # 唯一第三方卡：HACS 安装 ApexCharts Card；periods 是上述自定义 HA 展示态属性。
          - type: custom:apexcharts-card
            graph_span: 24h
            span:
              start: minute
            header:
              show: true
              title: 模拟现在起 24 小时 · 电价走势
            now:
              show: true
              label: 模拟现在
            apex_config:
              xaxis:
                labels:
                  show: false
              tooltip:
                x:
                  show: false
            series:
              - entity: "{{tariff_current_buy}}" # 待替换
                name: 购电价
                type: line
                curve: stepline
                color: "#1976d2"
                extend_to: false
                data_generator: |
                  const rows = entity.attributes.periods;
                  const simNow = Date.parse(entity.attributes.sim_now);
                  if (!Array.isArray(rows) || !Number.isFinite(simNow)) return [];
                  const wallNow = Date.now();
                   const current = Number(entity.state);
                   const future = rows.filter(p => p && Number.isFinite(p.buy_price))
                                      .map(p => [Date.parse(p.start), p.buy_price])
                                      .filter(([t]) => Number.isFinite(t) && t > simNow && t <= simNow + 86400000)
                                      .map(([t, v]) => [wallNow + t - simNow, v]);
                   return (Number.isFinite(current) ? [[wallNow, current]] : []).concat(future);
              - entity: "{{tariff_current_buy}}" # 待替换
                name: 售电价
                type: line
                curve: stepline
                color: "#f57c00"
                extend_to: false
                data_generator: |
                  const rows = entity.attributes.periods;
                  const simNow = Date.parse(entity.attributes.sim_now);
                  if (!Array.isArray(rows) || !Number.isFinite(simNow)) return [];
                  const wallNow = Date.now();
                   const current = entity.attributes.sell_price;
                   const future = rows.filter(p => p && Number.isFinite(p.sell_price))
                                      .map(p => [Date.parse(p.start), p.sell_price])
                                      .filter(([t]) => Number.isFinite(t) && t > simNow && t <= simNow + 86400000)
                                      .map(([t, v]) => [wallNow + t - simNow, v]);
                   return (Number.isFinite(current) ? [[wallNow, current]] : []).concat(future);
      - type: grid
        cards:
          - type: markdown
            title: 负电价时段
            entity_id:
              - "{{tariff_current_buy}}" # 待替换
            content: |-
              {% set t = '{{tariff_current_buy}}' %}
              {% set rows = state_attr(t, 'periods') %}
              {% set u = state_attr(t, 'unit_of_measurement') or '单位待确认' %}
              {% set sim_now = as_datetime(state_attr(t, 'sim_now'), none) %}
              {% if rows is iterable and rows is not string and sim_now %}
              {% set ns = namespace(count=0) %}
              {% for p in rows %}
              {% set when = as_datetime(p.start | default(none), none) %}
              {% if when and when >= sim_now and p.buy_price is number and p.buy_price < 0 %}
              {% set ns.count = ns.count + 1 %}
              - 🔵 {{ when.strftime('%m-%d %H:%M %z') }} 负**购**电价 {{ p.buy_price }} {{ u }}
              {% endif %}
              {% if when and when >= sim_now and p.sell_price is number and p.sell_price < 0 %}
              {% set ns.count = ns.count + 1 %}
              - 🔴 {{ when.strftime('%m-%d %H:%M %z') }} 负**售**电价 {{ p.sell_price }} {{ u }}：避免主动外送
              {% endif %}
              {% endfor %}
              {% if ns.count == 0 %}已提供的未来时段中，未见可确认的负电价。{% endif %}
              {% else %}未来时段或模拟器时钟待接入。{% endif %}

