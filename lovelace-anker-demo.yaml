  - title: 站点 1
    path: site-1
    icon: mdi:home-battery
    type: sections
    sections:
      - type: grid
        cards:
          - type: markdown
            title: 实时读数与预测
            entity_id:
              - "{{site1_soc}}" # 待替换
              - "{{site1_solar_power}}" # 待替换
              - "{{site1_home_load}}" # 待替换
              - "{{site1_battery_charging_power}}" # 待替换
              - "{{site1_battery_discharging_power}}" # 待替换
              - "{{site1_grid_import_power}}" # 待替换
              - "{{site1_grid_export_power}}" # 待替换
              - "{{forecast_site1}}" # 待替换：本站天气/辐照度预测
              - "{{decision_site1}}" # 待替换：本站调度程序展示态
            content: |-
              {% macro kw(e) -%}{% if is_number(states(e)) %}{{ (states(e) | float / 1000) | round(2) }} kW{% else %}待接入{% endif %}{%- endmacro %}
              | 指标 | 当前 |
              |:---|---:|
              | 电池 SOC | {% if is_number(states('{{site1_soc}}')) %}{{ states('{{site1_soc}}') | float | round(1) }}%{% else %}待接入{% endif %} |
              | ☀️ 光伏输出 | {{ kw('{{site1_solar_power}}') }} |
              | 🏠 家庭负载 | {{ kw('{{site1_home_load}}') }} |
              | 🔵 电池充入 | {{ kw('{{site1_battery_charging_power}}') }} |
              | 🟠 电池放出 | {{ kw('{{site1_battery_discharging_power}}') }} |
              | 🔴 电网购入 | {{ kw('{{site1_grid_import_power}}') }} |
              | 🟢 电网售出 | {{ kw('{{site1_grid_export_power}}') }} |

              {% set decision = '{{decision_site1}}' %}
              {% set expiry = as_datetime(state_attr(decision, 'valid_until'), none) %}
              **当前计划：** {% if has_value(decision) and expiry and expiry > now() %}{{ states(decision) }}；**理由：** {{ state_attr(decision, 'reason') or '待写入' }}{% else %}⚠️ 未同步或已过期{% endif %}

              **预测辐照度：** {% if is_number(states('{{forecast_site1}}')) %}{{ states('{{forecast_site1}}') }} W/m²{% else %}待接入{% endif %}；**天气：** {{ state_attr('{{forecast_site1}}', 'weather') or '待接入' }}

              预测有效时刻：{{ state_attr('{{forecast_site1}}', 'valid_at') or '待接入' }}
      - type: grid
        cards:
          - type: history-graph
            title: 站点 1 · SOC 近 24 小时
            hours_to_show: 24
            entities:
              - entity: "{{site1_soc}}" # 待替换
                name: SOC
          - type: history-graph
            title: 站点 1 · 光伏与负载近 24 小时（W）
            hours_to_show: 24
            entities:
              - entity: "{{site1_solar_power}}" # 待替换
                name: 光伏
              - entity: "{{site1_home_load}}" # 待替换
                name: 家庭负载
          - type: history-graph
            title: 站点 1 · 电池与电网近 24 小时（W）
            hours_to_show: 24
            entities:
              - entity: "{{site1_battery_charging_power}}" # 待替换
                name: 电池充入
              - entity: "{{site1_battery_discharging_power}}" # 待替换
                name: 电池放出
              - entity: "{{site1_grid_import_power}}" # 待替换
                name: 电网购入
              - entity: "{{site1_grid_export_power}}" # 待替换
                name: 电网售出

